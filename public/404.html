<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sayfa Bulunamadı (404) | ATLAS İSTANBUL Teknoloji</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        background: radial-gradient(120% 90% at 50% -10%, #1a3257 0%, #0c1a33 55%);
        color: #eef3fc;
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 560px; }
      .logo {
        height: 56px; width: auto; margin: 0 auto 28px;
        background: #fff; border-radius: 14px; padding: 8px;
        box-shadow: 0 10px 30px -10px rgba(0,0,0,.5);
      }
      .code {
        font-size: clamp(72px, 18vw, 140px);
        font-weight: 800; line-height: 1;
        background: linear-gradient(100deg, #a9d1f5, #3b82c4);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        letter-spacing: -0.03em;
      }
      h1 { font-size: clamp(20px, 5vw, 28px); font-weight: 700; margin-top: 14px; }
      p { color: #b9c6dd; margin-top: 12px; line-height: 1.6; font-weight: 500; }
      .btn {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 28px; padding: 14px 26px;
        background: linear-gradient(180deg, #3b82c4, #2b6cb0);
        color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
        border-radius: 12px; box-shadow: 0 12px 30px -10px rgba(43,108,176,.7);
        transition: transform .25s ease;
      }
      .btn:hover { transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/logo.png" alt="ATLAS İSTANBUL Teknoloji" />
      <div class="code">404</div>
      <h1>Sayfa bulunamadı</h1>
      <p>
        Aradığınız sayfa taşınmış veya hiç var olmamış olabilir.
        Ana sayfaya dönerek devam edebilirsiniz.
      </p>
      <a class="btn" href="/">← Ana Sayfaya Dön</a>
    </div>
  </body>
</html>
